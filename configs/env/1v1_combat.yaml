# 1v1 空战环境参考配置 (Reference only)
# 注意: 当前训练脚本 scripts/_train_shoot_1v1.py 不读取本文件,
# 实际生效配置见 src/environment/singlecombat_shoot_task.py 与 src/environment/base_env.py
env:
  name: "jsbsim_shoot_1v1"
  num_aircraft: 2          # 1 追击机 + 1 靶机
  ctrl_freq: 60            # Hz — JSBSim 物理子步频率
  decision_dt: 0.2         # s — 决策频率 5 Hz, 每步 12 个子步
  episode_max_steps: 1500  # 超时终止步数
  cpa_radius: 300.0        # 近炸引信待发半径 (m)
  deep_cpa: 200.0          # 两阶段引信: 深侵彻确认 CPA (m)

aircraft:
  model: "f16"
  data_dir: "data/jsbsim"  # aircraft/engine/systems 数据根目录 (或 JSBSIM_DATA_DIR)

wez:
  max_attack_angle_deg: 15.0
  min_attack_distance_m: 1500.0
  max_attack_distance_m: 8000.0      # 动态 DLZ 上限 (迎头)
  dynamic_dlz_tail_m: 3000.0         # 动态 DLZ 下限 (尾追)
  min_attack_interval_steps: 30      # 发射冷却 (6s)
  num_missiles: 4
  target_max_hits: 4

termination:
  low_altitude_m: 1000.0
  alt_deviation_flee_m: 3000.0
  lost_target_m: 15000.0

curriculum:
  stage_1:
    difficulty: 0.0       # 靶机直线飞行
    iterations: 100
  stage_2:
    difficulty: 0.3       # 靶机 S 转弯 + 导弹规避
    iterations: 300
    resume_from: "marl_runs/shoot_stage1_s42/checkpoints/best"